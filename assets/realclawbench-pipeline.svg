<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">RealClawBench pipeline</title>
  <desc id="desc">Real OpenClaw sessions are transformed through privacy screening, environment reconstruction, request rewriting, deterministic verification, and versioned releases.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa6b2"/>
    </marker>
  </defs>
  <rect width="940" height="430" rx="22" fill="#ffffff"/>
  <g filter="url(#shadow)">
    <rect x="42" y="60" width="182" height="116" rx="12" fill="#f8fafc" stroke="#d8dee8"/>
    <rect x="42" y="212" width="182" height="116" rx="12" fill="#f8fafc" stroke="#d8dee8"/>
    <rect x="286" y="54" width="158" height="86" rx="12" fill="#eef4ff" stroke="#c9dafd"/>
    <rect x="286" y="172" width="158" height="86" rx="12" fill="#eef4ff" stroke="#c9dafd"/>
    <rect x="286" y="290" width="158" height="86" rx="12" fill="#eef4ff" stroke="#c9dafd"/>
    <rect x="510" y="80" width="160" height="90" rx="12" fill="#f7fbff" stroke="#d8e4f5"/>
    <rect x="510" y="250" width="160" height="90" rx="12" fill="#f7fbff" stroke="#d8e4f5"/>
    <rect x="730" y="116" width="168" height="150" rx="14" fill="#fff8e8" stroke="#f3d38a"/>
  </g>
  <text x="133" y="92" text-anchor="middle" fill="#101827" font-size="18" font-weight="700">Real OpenClaw</text>
  <text x="133" y="118" text-anchor="middle" fill="#101827" font-size="18" font-weight="700">Sessions</text>
  <text x="133" y="145" text-anchor="middle" fill="#65758b" font-size="14">requests, tools, files</text>
  <text x="133" y="246" text-anchor="middle" fill="#101827" font-size="18" font-weight="700">Later Windows</text>
  <text x="133" y="276" text-anchor="middle" fill="#65758b" font-size="14">new deployed demand</text>
  <text x="365" y="88" text-anchor="middle" fill="#1f5edc" font-size="15" font-weight="700">1. Privacy screening</text>
  <text x="365" y="112" text-anchor="middle" fill="#64748b" font-size="13">remove secrets and unsafe cases</text>
  <text x="365" y="207" text-anchor="middle" fill="#1f5edc" font-size="15" font-weight="700">2. Environment rebuild</text>
  <text x="365" y="231" text-anchor="middle" fill="#64748b" font-size="13">restore files, dependencies, fixtures</text>
  <text x="365" y="325" text-anchor="middle" fill="#1f5edc" font-size="15" font-weight="700">3. Request rewrite</text>
  <text x="365" y="349" text-anchor="middle" fill="#64748b" font-size="13">standalone, sanitized instruction</text>
  <text x="590" y="114" text-anchor="middle" fill="#101827" font-size="16" font-weight="700">Deterministic</text>
  <text x="590" y="140" text-anchor="middle" fill="#101827" font-size="16" font-weight="700">Verifier</text>
  <text x="590" y="284" text-anchor="middle" fill="#101827" font-size="16" font-weight="700">OpenClaw</text>
  <text x="590" y="310" text-anchor="middle" fill="#101827" font-size="16" font-weight="700">Harness</text>
  <text x="814" y="156" text-anchor="middle" fill="#9a650f" font-size="17" font-weight="800">Versioned Release</text>
  <text x="814" y="188" text-anchor="middle" fill="#4b5563" font-size="14">instructions</text>
  <text x="814" y="212" text-anchor="middle" fill="#4b5563" font-size="14">workspaces</text>
  <text x="814" y="236" text-anchor="middle" fill="#4b5563" font-size="14">verifiers and results</text>
  <path d="M224 118 C244 118 262 98 282 98" fill="none" stroke="#9aa6b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M224 270 C250 270 258 216 282 216" fill="none" stroke="#9aa6b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M444 98 C472 98 480 126 506 126" fill="none" stroke="#9aa6b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M444 216 C468 216 482 292 506 292" fill="none" stroke="#9aa6b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M444 334 C472 334 480 292 506 292" fill="none" stroke="#9aa6b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M670 126 C706 126 704 182 726 182" fill="none" stroke="#9aa6b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M670 292 C704 292 704 210 726 210" fill="none" stroke="#9aa6b2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="410" text-anchor="middle" fill="#64748b" font-size="15">Real demand in, reproducible verifier-scored benchmark tasks out.</text>
</svg>
